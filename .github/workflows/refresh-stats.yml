name: Refresh stats cache

# Виджеты статистики кэшируются на 24 часа (streak) и на 4 часа (карточки).
# Этот воркфлоу раз в сутки меняет параметр ?v= в README,
# из-за чего GitHub-прокси заново забирает свежие картинки.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cache-buster
        run: |
          today=$(date -u +%Y%m%d)
          sed -i -E "s/([?&]v=)[0-9]+/\1${today}/g" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi
          git commit -m "chore: refresh stats cache [skip ci]"
          git push
